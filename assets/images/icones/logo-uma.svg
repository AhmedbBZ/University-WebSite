<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Logo Université de la Manouba — version stylisée -->
  <circle cx="100" cy="100" r="98" stroke="#C8A951" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="#0D2B5E"/>
  <!-- Livre ouvert -->
  <rect x="55" y="85" width="40" height="30" rx="2" fill="#C8A951" opacity="0.9"/>
  <rect x="105" y="85" width="40" height="30" rx="2" fill="#C8A951" opacity="0.7"/>
  <rect x="95" y="82" width="10" height="36" rx="1" fill="#071A3E"/>
  <!-- Étoile / soleil -->
  <circle cx="100" cy="62" r="10" fill="#C8A951"/>
  <line x1="100" y1="47" x2="100" y2="42" stroke="#C8A951" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="82" x2="100" y2="77" stroke="#C8A951" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="62" x2="80" y2="62" stroke="#C8A951" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="62" x2="115" y2="62" stroke="#C8A951" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Texte UMA -->
  <text x="100" y="145" font-family="Georgia,serif" font-size="18" font-weight="bold"
        fill="white" text-anchor="middle" letter-spacing="4">UMA</text>
  <text x="100" y="162" font-family="Arial,sans-serif" font-size="7"
        fill="#C8A951" text-anchor="middle" letter-spacing="1">UNIVERSITÉ DE LA MANOUBA</text>
</svg>
